name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build release artifacts
        run: ./gradlew build :tickbudget-api:sourcesJar :tickbudget-api:javadocJar

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            tickbudget-plugin/build/libs/TickBudget-*.jar
            tickbudget-api/build/libs/tickbudget-api-*.jar
          generate_release_notes: true
          draft: false
          prerelease: false
