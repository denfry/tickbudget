name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Full history and tags, for the version check and the changelog
          fetch-depth: 0

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Set up JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Check that the tag matches the project version
        run: |
          VERSION=$(./gradlew -q :tickbudget-plugin:properties --property version | awk '/^version:/ {print $2}')
          if [ "${GITHUB_REF_NAME}" != "v${VERSION}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match project version ${VERSION}"
            exit 1
          fi

      - name: Build release artifacts
        run: ./gradlew build :tickbudget-api:sourcesJar :tickbudget-api:javadocJar

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            tickbudget-plugin/build/libs/TickBudget-*.jar
            tickbudget-api/build/libs/tickbudget-api-*.jar
          generate_release_notes: true
          draft: false
          prerelease: false

      - name: Publish to Modrinth
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
        run: |
          PREVIOUS=$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)
          export MODRINTH_CHANGELOG="$(git log --no-merges --pretty='- %s' "${PREVIOUS:+${PREVIOUS}..}${GITHUB_REF_NAME}")"
          ./gradlew :tickbudget-plugin:modrinth :tickbudget-plugin:modrinthSyncBody
